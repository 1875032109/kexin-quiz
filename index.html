<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>科信部刷题小程序</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
:root{--primary:#1677ff;--success:#52c41a;--danger:#ff4d4f;--bg:#f7f8fa;--card:#fff;--tm:#222;--ts:#666;}
html,body{background:var(--bg);color:var(--tm);min-height:100vh;}
body{padding-bottom:120px;}
.page{display:none;}
.page.active{display:block;}
h2{font-size:20px;}
/* 首页 */
.home{padding:16px;}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.card .sub{color:var(--ts);font-size:14px;margin-top:6px;line-height:1.7;}
.stat-row{display:flex;gap:10px;margin-top:12px;}
.stat-box{flex:1;background:#f0f5ff;border-radius:8px;padding:10px;text-align:center;}
.stat-box b{display:block;font-size:20px;color:var(--primary);}
.stat-box span{font-size:12px;color:var(--ts);}
.btn{display:block;width:100%;min-height:48px;line-height:48px;text-align:center;border-radius:10px;border:none;font-size:16px;margin-bottom:12px;cursor:pointer;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-default{background:#fff;color:var(--primary);border:1px solid var(--primary);}
/* 答题页 */
.exam-header{position:fixed;top:0;left:0;right:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,0.08);z-index:99;}
.exit-btn{font-size:14px;color:var(--ts);background:none;border:none;min-height:44px;padding:0 6px;cursor:pointer;}
.q-index{font-size:17px;font-weight:600;color:var(--tm);}
.star-btn{font-size:26px;cursor:pointer;user-select:none;background:none;border:none;min-height:44px;min-width:44px;}
.exam-body{margin-top:70px;padding:16px;}
.type-tag{display:inline-block;background:#e8f3ff;color:var(--primary);padding:4px 10px;border-radius:4px;font-size:13px;margin-right:8px;}
.kn-tag{display:inline-block;background:#f6f6f6;color:var(--ts);padding:4px 10px;border-radius:4px;font-size:12px;}
.question-title{font-size:17px;line-height:1.8;margin:14px 0 18px;word-break:break-all;}
.option{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:10px;min-height:48px;display:flex;align-items:center;border:1px solid #e5e7eb;cursor:pointer;transition:all .15s ease;font-size:15px;line-height:1.6;}
.option:active{transform:scale(0.985);}
.option .opt-key{font-weight:600;margin-right:8px;color:var(--primary);}
.option.selected{border-color:var(--primary);background:#e8f3ff;}
.option.right{border-color:var(--success);background:#f6ffed;}
.option.right .opt-key{color:var(--success);}
.option.wrong{border-color:var(--danger);background:#fff2f0;}
.option.wrong .opt-key{color:var(--danger);}
.option.disabled{pointer-events:none;}
.analysis{margin-top:16px;background:#fff;border-radius:10px;padding:14px 16px;display:none;line-height:1.7;}
.analysis.show{display:block;}
.analysis .a-title{font-weight:600;color:var(--success);margin-bottom:6px;}
.analysis p{font-size:14px;color:#555;margin:4px 0;word-break:break-all;}
.exam-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;box-shadow:0 -2px 6px rgba(0,0,0,0.06);}
.exam-footer button{flex:1;min-height:48px;border-radius:10px;border:none;font-size:16px;cursor:pointer;background:var(--primary);color:#fff;}
.exam-footer button:disabled{background:#c9c9c9;opacity:.6;}
.exam-footer button.next{background:var(--primary);}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal.show{display:flex;}
.modal-content{background:#fff;border-radius:14px;padding:26px 22px;width:100%;max-width:360px;text-align:center;}
.modal-content h3{font-size:19px;margin-bottom:14px;}
.modal-content .rate{font-size:38px;font-weight:700;color:var(--primary);}
.modal-content .rate-sub{color:var(--ts);font-size:15px;margin:10px 0 18px;line-height:1.8;}
.modal-btn{min-height:48px;width:100%;border-radius:10px;border:none;font-size:16px;cursor:pointer;margin-top:10px;}
/* 列表页 */
.list-page{padding:16px;}
.list-page h2{margin-bottom:12px;}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-chip{padding:6px 14px;border-radius:16px;border:1px solid #d9d9d9;background:#fff;font-size:13px;cursor:pointer;min-height:32px;}
.filter-chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.list-item{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;line-height:1.6;font-size:14px;border:1px solid #eef0f2;}
.list-item .li-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.list-item .li-type{font-size:12px;padding:2px 8px;border-radius:4px;background:#e8f3ff;color:var(--primary);}
.list-item .li-time{font-size:12px;color:#999;}
.list-item .li-title{font-size:14px;color:var(--tm);}
.list-item .li-actions{margin-top:8px;display:flex;gap:10px;}
.list-item .li-actions button{flex:1;min-height:40px;border-radius:8px;border:1px solid #d9d9d9;background:#fff;font-size:13px;cursor:pointer;}
.empty{text-align:center;color:#999;padding:40px 0;font-size:14px;}
</style>
</head>
<body>

<!-- 首页 -->
<div class="page home active" id="pageHome">
  <div class="card">
    <h2>科信部刷题系统</h2>
    <div class="sub">试题来源：《试题科信部.xlsx》全量导入<br>组卷规则：每套100题＝单选60＋多选20＋判断20</div>
    <div class="stat-row">
      <div class="stat-box"><b id="stSingle">0</b><span>单选题</span></div>
      <div class="stat-box"><b id="stMulti">0</b><span>多选题</span></div>
      <div class="stat-box"><b id="stJudge">0</b><span>判断题</span></div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="startPaper()">开始100题模拟试卷</button>
  <button class="btn btn-default" onclick="showWrong()">错题本<span id="wrongCount" style="margin-left:6px;color:#ff4d4f;"></span></button>
  <button class="btn btn-default" onclick="showCollect()">我的收藏<span id="collectCount" style="margin-left:6px;color:#1677ff;"></span></button>
  <div class="card">
    <div class="sub" id="recordText">累计答题：0 题｜答对：0 题</div>
  </div>
</div>

<!-- 答题页 -->
<div class="page exam" id="pageExam">
  <div class="exam-header">
    <button class="exit-btn" onclick="exitExam()">‹ 退出</button>
    <span class="q-index" id="qIndex">1/100</span>
    <button class="star-btn" id="starBtn">☆</button>
  </div>
  <div class="exam-body">
    <div>
      <span class="type-tag" id="typeTag">单选题</span>
      <span class="kn-tag" id="knTag"></span>
    </div>
    <div class="question-title" id="qTitle"></div>
    <div id="optionBox"></div>
    <div class="analysis" id="analysisBox">
      <div class="a-title" id="aTitle"></div>
      <p><b>正确答案：</b><span id="ansText"></span></p>
      <p><b>考点解析：</b><span id="analysisText"></span></p>
    </div>
  </div>
  <div class="exam-footer">
    <button id="prevBtn" onclick="prevQ()">上一题</button>
    <button id="nextBtn" class="next" onclick="nextQ()">下一题</button>
  </div>
</div>

<!-- 错题本 -->
<div class="page list-page" id="pageWrong">
  <h2>错题本 <span id="wrongTotal" style="font-size:14px;color:#999;"></span></h2>
  <div class="filter-row" id="wrongFilter">
    <span class="filter-chip on" data-f="全部">全部</span>
    <span class="filter-chip" data-f="单选题">单选</span>
    <span class="filter-chip" data-f="多选题">多选</span>
    <span class="filter-chip" data-f="判断题">判断</span>
  </div>
  <button class="btn btn-primary" onclick="startWrong()">错题重做</button>
  <button class="btn btn-default" onclick="clearWrong()">一键清空错题</button>
  <div id="wrongListBox"></div>
  <button class="btn btn-default" style="margin-top:20px" onclick="backHome()">返回首页</button>
</div>

<!-- 收藏 -->
<div class="page list-page" id="pageCollect">
  <h2>我的收藏 <span id="collectTotal" style="font-size:14px;color:#999;"></span></h2>
  <button class="btn btn-primary" onclick="startCollect()">收藏刷题</button>
  <div id="collectListBox"></div>
  <button class="btn btn-default" style="margin-top:20px" onclick="backHome()">返回首页</button>
</div>

<!-- 结算弹窗 -->
<div class="modal" id="resultModal">
  <div class="modal-content">
    <h3>试卷完成</h3>
    <div class="rate" id="rateNum">0%</div>
    <div class="rate-sub" id="rateSub">答对 0 题 / 共 0 题</div>
    <button class="modal-btn btn-primary" onclick="modalDone()">完成</button>
  </div>
</div>

<!-- 答对移除错题提示弹窗 -->
<div class="modal" id="askModal">
  <div class="modal-content">
    <h3>本题已答对</h3>
    <div class="rate-sub">是否将其从错题本中移除？</div>
    <button class="modal-btn btn-primary" onclick="askRemove(true)">移出错题本</button>
    <button class="modal-btn btn-default" onclick="askRemove(false)">保留</button>
  </div>
</div>

<script>

土建", "difficulty": "基本题", "title": "根据《建设工程项目管理规范》GB/T 50326-2017，项目实施阶段的进度控制主要包括设计准备、设计、施工、动用前准备阶段进度控制。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "B", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30036, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "施工现场高度超过2m的竖向作业面，均必须设置临边防护栏杆及挡脚板。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "B", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30037, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "总承包单位将全部工程交由其他单位施工，属于转包行为，而非违法分包行为。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30038, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "根据《砌体结构工程施工质量验收规范》GB 50203-2011，砌体工程施工中，直槎拉结钢筋的间距不应大于500mm。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30039, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "施工成本的过程控制中，人工费、材料费、机械费均属于现场成本控制核心内容。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30040, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "根据《屋面工程质量验收规范》GB 50207-2012，屋面蓄水试验蓄水时间不得少于24h。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30041, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "混凝土同条件养护试块的等效养护龄期可取按日平均温度逐日累计达到600℃·d时对应的龄期。（）", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 0049, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "当梁中不同直径的钢筋进行搭接时，其搭接长度应按较大直径的钢筋进行计算。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "B", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30050, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "为保证后浇带支撑稳定性，后浇带部位支撑体系应与满堂架体做可靠连接，并且不得随意拆除。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "B", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30051, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "基本题", "title": "边柱、外围剪力墙、楼梯间、电梯井等部位设置老墙螺杆，外围墙柱模板伸入下层结构宜为150-200mm，预埋螺栓或设穿墙丝杆加固，减少混凝土结构的错台、穿裙。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：基本题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30052, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "进阶题", "title": "止水钢板焊接连接时，搭接长度满足设计要求；设计无明确要求时，至少三面围焊搭接，搭接长度≮50mm，且焊缝饱满、顺滑，无漏焊、无孔眼等缺陷。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：进阶题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30053, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "进阶题", "title": "旋挖钻机钻进过程中，由于地表土层松散、地下水位高引起孔口塌孔，在综合考虑施工成本情况下，通常采用低标号混凝土回填至塌孔位置以上，待混凝土强度达到5MPa以上再继续钻进。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "B", "analysis": "本题考点：建筑工程-建筑土建；难度等级：进阶题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30054, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "进阶题", "title": "旋挖钻机钻进过程中，在桩孔中部出现塌孔现象时，应遵循“先填充、后稳孔、再钻进”原则进行塌孔处理。", "options": {"A": "正确", "B": "错误", "C": "/", "D": "/"}, "answer": "A", "analysis": "本题考点：建筑工程-建筑土建；难度等级：进阶题；题型：判断题。请结合对应专业施工规范与技术标准，重点掌握该知识点下的安全与质量考核要点。"}, {"id": 30055, "type": "判断题", "knowledge": "建筑工程-建筑土建", "difficulty": "进阶题", "title": "旋挖钻机钻进过程中，桩孔底部出现塌孔现象时，当采用回填法无效、孔底持续坍塌或持力层为流塑状淤泥/流沙时，可采用机械支护方式进行桩孔处理。", "options": {"A": "正确", "B": "错误" function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
// 知识点分组轮转抽题，保证覆盖均匀
function pickBalanced(pool, n){
  const groups = {};
  pool.forEach(q=>{ (groups[q.knowledge] = groups[q.knowledge] || []).push(q); });
  Object.keys(groups).forEach(k=>{ groups[k] = shuffle(groups[k]); });
  let keys = Object.keys(groups);
  const result = [];
  let gi = 0;
  while(result.length < n && keys.length > 0){
    const k = keys[gi % keys.length];
    if(groups[k].length === 0){ keys.splice(gi % keys.length, 1); continue; }
    result.push(groups[k].pop());
    gi++;
  }
  return result;
}

function startPaper(){
  const singlePool = questionBank.filter(q=>q.type==='单选题');
  const multiPool = questionBank.filter(q=>q.type==='多选题');
  const judgePool = questionBank.filter(q=>q.type==='判断题');
  examPaper = pickBalanced(singlePool, 60).concat(pickBalanced(multiPool, 20)).concat(pickBalanced(judgePool, 20));
  currentIdx = 0; answerMap = {}; examMode = 'paper';
  saveProgress();
  switchPage('pageExam');
  renderQuestion();
}
function exitExam(){
  if(confirm('退出当前答题？进度已自动保存，下次进入可继续。')){ backHome(); }
}

// ==================== 渲染题目 ====================
function renderQuestion(){
  const q = examPaper[currentIdx];
  $('qIndex').innerText = `${currentIdx+1}/${examPaper.length}`;
  $('typeTag').innerText = q.type;
  $('knTag').innerText = q.knowledge;
  $('qTitle').innerText = q.title;

  $('starBtn').innerText = collectList.includes(q.id) ? '★' : '☆';
  $('starBtn').onclick = ()=>{
    if(collectList.includes(q.id)) collectList = collectList.filter(x=>x!==q.id);
    else collectList.push(q.id);
    storage.set('collectList', collectList);
    renderQuestion();
  };

  const optBox = $('optionBox');
  optBox.innerHTML = '';
  const us = answerMap[q.id] || {sel:[], judged:false};
  const isMulti = q.type === '多选题';
  Object.keys(q.options).forEach(key=>{
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="opt-key">${key}.</span><span>${q.options[key]}</span>`;
    if(us.sel.includes(key)) div.classList.add('selected');
    if(us.judged){
      div.classList.add('disabled');
      if(q.answer.includes(key)) div.classList.add('right');
      else if(us.sel.includes(key)) div.classList.add('wrong');
    }
    div.onclick = ()=>{
      if(us.judged) return;
      if(isMulti){
        if(us.sel.includes(key)) us.sel = us.sel.filter(x=>x!==key);
        else us.sel.push(key);
        answerMap[q.id] = us;
        renderQuestion();
      }else{
        us.sel = [key]; us.judged = true;
        answerMap[q.id] = us;
        checkAnswer(q, us);
        renderQuestion();
      }
    };
    optBox.appendChild(div);
  });

  // 解析区
  const ab = $('analysisBox');
  if(us.judged){
    ab.classList.add('show');
    $('aTitle').innerText = (us.sel.slice().sort().join('') === q.answer.split('').sort().join('')) ? '✓ 回答正确' : '✗ 回答错误';
    $('ansText').innerText = q.answer;
    $('analysisText').innerText = q.analysis;
  } else {
    ab.classList.remove('show');
  }

  // 底部
  $('prevBtn').disabled = currentIdx === 0;
  $('nextBtn').innerText = (currentIdx === examPaper.length-1) ? '提交试卷' : '下一题';
  if(currentIdx === examPaper.length-1) $('nextBtn').style.background = '#ff7a45';
  else $('nextBtn').style.background = '';
}

// ==================== 判题 ====================
function checkAnswer(q, us){
  const u = us.sel.slice().sort().join('');
  const std = q.answer.split('').sort().join('');
  const ok = u === std;
  record.total++;
  if(ok){
    record.right++;
    const wIdx = wrongList.findIndex(w=>w.id===q.id);
    if(wIdx >= 0){
      pendingWrongRemove = q.id;
      setTimeout(()=>{ $('askModal').classList.add('show'); }, 260);
    }
  } else {
    if(!wrongList.some(w=>w.id===q.id)){
      wrongList.push({id:q.id, t: Date.now()});
      storage.set('wrongList', wrongList);
    }
  }
  storage.set('record', record);
}
let pendingWrongRemove = null;
function askRemove(remove){
  $('askModal').classList.remove('show');
  if(remove && pendingWrongRemove !== null){
    wrongList = wrongList.filter(w=>w.id!==pendingWrongRemove);
    storage.set('wrongList', wrongList);
  }
  pendingWrongRemove = null;
}

// ==================== 上一题 / 下一题 ====================
function prevQ(){
  if(currentIdx > 0){
    currentIdx--;
    saveProgress();
    renderQuestion();
  }
}
function nextQ(){
  if(currentIdx === examPaper.length - 1){
    calcResult();
    return;
  }
  const q = examPaper[currentIdx];
  const us = answerMap[q.id] || {sel:[], judged:false};
  if(q.type === '多选题' && !us.judged){
    if(us.sel.length === 0){ alert('请至少选择一个选项后再进入下一题'); return; }
    us.judged = true;
    answerMap[q.id] = us;
    checkAnswer(q, us);
  }
  currentIdx++;
  saveProgress();
  renderQuestion();
}
function saveProgress(){
  if(examPaper.length){
    progress = {list: examPaper.map(q=>q.id), current: currentIdx, answerMap};
    storage.set('progress', progress);
  }
}

// ==================== 结算 ====================
function calcResult(){
  let right = 0, wrong = 0;
  examPaper.forEach(q=>{
    const s = answerMap[q.id];
    if(!s || !s.judged){ wrong++; return; }
    const u = s.sel.slice().sort().join('');
    const std = q.answer.split('').sort().join('');
    u === std ? right++ : wrong++;
  });
  const rate = examPaper.length ? ((right/examPaper.length)*100).toFixed(1) : '0.0';
  $('rateNum').innerText = rate + '%';
  $('rateSub').innerText = `答对 ${right} 题｜答错 ${wrong} 题｜共 ${examPaper.length} 题`;
  $('resultModal').classList.add('show');
}
function modalDone(){
  $('resultModal').classList.remove('show');
  progress = null;
  storage.remove('progress');
  backHome();
}

// ==================== 错题本 ====================
let wrongFilter = '全部';
function showWrong(){
  switchPage('pageWrong');
  renderWrong();
}
function renderWrong(){
  $('wrongTotal').innerText = `（共 ${wrongList.length} 题）`;
  const box = $('wrongListBox');
  box.innerHTML = '';
  let list = wrongList.map(w=>({q: questionBank.find(q=>q.id===w.id), t: w.t})).filter(x=>x.q);
  if(wrongFilter !== '全部') list = list.filter(x=>x.q.type === wrongFilter);
  if(list.length === 0){
    box.innerHTML = '<div class="empty">暂无错题，继续加油！</div>';
    return;
  }
  list.forEach(x=>{
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="li-head"><span class="li-type">${x.q.type}</span><span class="li-time">${fmtTime(x.t)}</span></div>
      <div class="li-title">${escapeHtml(x.q.title)}</div>
      <div class="li-actions">
        <button onclick="removeOneWrong(${x.q.id})">移出错题本</button>
        <button onclick="viewDetail(${x.q.id})">查看详情</button>
      </div>`;
    box.appendChild(div);
  });
}
function fmtTime(t){
  if(!t) return '';
  const d = new Date(t);
  const p = n=> (n<10?'0':'')+n;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function removeOneWrong(id){
  wrongList = wrongList.filter(w=>w.id!==id);
  storage.set('wrongList', wrongList);
  renderWrong();
}
function clearWrong(){
  if(confirm('确认清空全部错题？')){
    wrongList = [];
    storage.set('wrongList', wrongList);
    renderWrong();
  }
}
function startWrong(){
  const qs = wrongList.map(w=>questionBank.find(q=>q.id===w.id)).filter(Boolean);
  if(qs.length === 0){ alert('暂无错题'); return; }
  examPaper = qs;
  currentIdx = 0; answerMap = {}; examMode = 'wrong';
  saveProgress();
  switchPage('pageExam');
  renderQuestion();
}
function viewDetail(id){
  const q = questionBank.find(x=>x.id===id);
  if(!q) return;
  alert(`【${q.type}】\n${q.title}\n\n正确答案：${q.answer}\n考点解析：${q.analysis}`);
}

// 错题筛选
document.getElementById('wrongFilter').addEventListener('click', function(e){
  const chip = e.target.closest('.filter-chip');
  if(!chip) return;
  this.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('on'));
  chip.classList.add('on');
  wrongFilter = chip.dataset.f;
  renderWrong();
});

// ==================== 收藏 ====================
function showCollect(){
  switchPage('pageCollect');
  renderCollect();
}
function renderCollect(){
  $('collectTotal').innerText = `（共 ${collectList.length} 题）`;
  const box = $('collectListBox');
  box.innerHTML = '';
  const list = collectList.map(id=>questionBank.find(q=>q.id===id)).filter(Boolean);
  if(list.length === 0){
    box.innerHTML = '<div class="empty">暂无收藏题目</div>';
    return;
  }
  list.forEach(q=>{
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="li-head"><span class="li-type">${q.type}</span></div>
      <div class="li-title">${escapeHtml(q.title)}</div>
      <div class="li-actions">
        <button onclick="removeOneCollect(${q.id})">取消收藏</button>
        <button onclick="viewDetail(${q.id})">查看详情</button>
      </div>`;
    box.appendChild(div);
  });
}
function removeOneCollect(id){
  collectList = collectList.filter(x=>x!==id);
  storage.set('collectList', collectList);
  renderCollect();
}
function startCollect(){
  const qs = collectList.map(id=>questionBank.find(q=>q.id===id)).filter(Boolean);
  if(qs.length === 0){ alert('暂无收藏题目'); return; }
  examPaper = qs;
  currentIdx = 0; answerMap = {}; examMode = 'collect';
  saveProgress();
  switchPage('pageExam');
  renderQuestion();
}

// ==================== 初始化：恢复进度 ====================
window.onload = function(){
  refreshHome();
  if(progress && progress.list && progress.list.length > 0){
    examPaper = progress.list.map(id=>questionBank.find(q=>q.id===id)).filter(Boolean);
    if(examPaper.length){
      currentIdx = Math.min(progress.current || 0, examPaper.length-1);
      answerMap = progress.answerMap || {};
      switchPage('pageExam');
      renderQuestion();
    }
  }
}
</script>
